[project]
name = "evcsr-rl-prototype"
version = "0.7.10"
requires-python = "==3.11.*"
dependencies = [
    "traci==1.26.*",
    "sumolib==1.26.*",
    "libsumo==1.26.*",
    
    "torch>=2,<3",
    "stable-baselines3>=2,<3",
    "gymnasium>=1,<2",
    "setuptools<82",
    "tensorboard>=2,<3",
    
    "numpy<3",
    "pandas<4",    
    "pyarrow<24", 
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "seaborn",
    "wandb<1",
    "snakeviz",
    "scipy",
]
